<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArXiv Radar — AI Research Intelligence</title>
<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Material Symbols for A2UI and Header Icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --bg: #f8fafc;
    --border: #e2e8f0;
    --header-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    --header-text: #f8fafc;
    --text-primary: #1e293b;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    font-size: 1.8rem !important;
    color: #818cf8;
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
  }
  .brand-badge {
    background: rgba(129, 140, 248, 0.15);
    color: #a5b4fc;
    border: 1px solid rgba(129, 140, 248, 0.3);
    padding: 0.25rem 0.65rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }

  /* --- Dialogue Row Layout --- */
  .msg-row {
    display: flex;
    gap: 0.75rem;
    margin: 1.25rem 0;
    align-items: flex-start;
  }
  .msg-row.user {
    justify-content: flex-end;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.05);
  }
  .msg-row.user .avatar {
    background: #e0e7ff;
    border-color: #c7d2fe;
  }
  .avatar .material-symbols-outlined {
    font-size: 1.25rem;
    color: var(--accent);
  }
  .msg-content {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }
  .msg-row.user .msg-content {
    align-items: flex-end;
  }
  .sender-meta {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
  }
  .bubble {
    padding: 0.95rem 1.25rem;
    border-radius: 16px;
    background: #ffffff;
    border: 1px solid var(--border);
    text-align: left;
    line-height: 1.6;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  }
  .msg-row.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.22);
  }
  .bubble.rich { background: transparent; border: none; padding: 0; max-width: 100%; box-shadow: none; }
  
  /* Welcome Hero Card */
  .welcome-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.25rem 1.75rem;
    text-align: center;
    margin: 2.5rem auto;
    max-width: 580px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
  }
  .welcome-icon {
    font-size: 2.8rem !important;
    color: var(--accent);
    margin-bottom: 0.6rem;
  }
  .welcome-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 0.5rem;
  }
  .welcome-desc {
    font-size: 0.94rem;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.55;
  }

  .text-body h1, .text-body h2, .text-body h3, .text-body h4 { margin: 0.5rem 0 0.3rem; font-weight: 700; color: #0f172a; }
  .text-body h1 { font-size: 1.35rem; }
  .text-body h2 { font-size: 1.2rem; }
  .text-body h3 { font-size: 1.05rem; }
  .text-body code { background: #f1f5f9; color: #0f172a; padding: 0.15rem 0.35rem; border-radius: 4px; font-family: monospace; font-size: 0.88rem; }
  
  .prompts-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem 1.5rem 0.2rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .prompts-bar::-webkit-scrollbar { display: none; }
  .prompt-chip {
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.45rem 0.85rem;
    border-radius: 9999px;
    font-size: 0.83rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .prompt-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #f1f5f9;
    transform: translateY(-1px);
  }

  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.6rem 1.5rem 1rem;
    background: var(--bg);
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.98rem;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
  }
  button {
    padding: 0.75rem 1.25rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  button:hover {
    background: var(--accent-hover);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.35rem;
    background: #ffffff;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    max-width: 100%;
    margin-top: 0.6rem;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: #1e293b; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: #1e293b; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 8px; display: block; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="material-symbols-outlined brand-icon">radar</span>
    <span class="brand-title">ArXiv Radar</span>
  </div>
  <span class="brand-badge">AI Safety & Interpretability Intelligence</span>
</header>

<div id="log">
  <div id="welcome-card" class="welcome-card">
    <span class="material-symbols-outlined welcome-icon">radar</span>
    <h2 class="welcome-title">Welcome to ArXiv Radar</h2>
    <p class="welcome-desc">Your AI assistant for discovering research papers, analyzing model sycophancy, and evaluating safety benchmarks. Ask a question or click a prompt below to get started!</p>
  </div>
</div>

<div class="prompts-bar">
  <button class="prompt-chip" type="button" onclick="sendPrompt('Summarize arXiv paper 2609.00067 on contextual sycophancy')">📄 Summarize paper 2609.00067</button>
  <button class="prompt-chip" type="button" onclick="sendPrompt('Find recent papers on LLM interpretability and evaluation')">🔍 Find interpretability papers</button>
  <button class="prompt-chip" type="button" onclick="sendPrompt('What research topics relate to EvalBench-Sycophancy?')">🎯 Check project relevance</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask about research papers, topics, or trends…" autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

function removeWelcome() {
  const welcome = document.getElementById("welcome-card");
  if (welcome) welcome.remove();
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function createMsgRow(who) {
  removeWelcome();
  const row = el("div", "msg-row " + who);
  
  const avatar = el("div", "avatar");
  const icon = el("span", "material-symbols-outlined", who === "user" ? "person" : "radar");
  avatar.appendChild(icon);

  const col = el("div", "msg-content");
  const senderMeta = el("div", "sender-meta", who === "user" ? "You" : "ArXiv Radar");
  const b = el("div", "bubble");

  col.appendChild(senderMeta);
  col.appendChild(b);

  if (who === "user") {
    row.appendChild(col);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(col);
  }

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function formatMarkdown(text) {
  if (!text) return "";
  let html = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/### (.*?)(?:\n|$)/g, "<h3>$1</h3>")
    .replace(/## (.*?)(?:\n|$)/g, "<h2>$1</h2>")
    .replace(/# (.*?)(?:\n|$)/g, "<h1>$1</h1>")
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/`(.*?)`/g, "<code>$1</code>")
    .replace(/\n/g, "<br>");
  return html;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear "…"
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n\n").trim();
  if (textStr) {
    const textDiv = el("div", "text-body");
    textDiv.innerHTML = formatMarkdown(textStr);
    b.appendChild(textDiv);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  
  const userBubble = createMsgRow("user");
  userBubble.textContent = text;
  input.value = "";
  
  const agentBubble = createMsgRow("agent");
  agentBubble.textContent = "…";
  
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(agentBubble, data.parts || []);
  } catch (e) {
    agentBubble.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
